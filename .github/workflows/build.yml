name: Build MidiEditor

on:
  push:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    container:
      image: debian:stable-backports
      options: --privileged

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt6 and dependencies
      run: |
        apt-get update
        apt-get install -y \
          qt6-base-dev \
          qt6-multimedia-dev \
          qt6-wayland-dev \
          qt6-tools-dev \
          libasound2-dev \
          libfluidsynth-dev \
          build-essential \
          libapparmor-dev \
          libcap-dev \
          libqt63dcore6 \
          libqt6core6t64 \
          wget file

    - name: Build project
      run: |
        qmake6
        make -j$(nproc)

    - name: Create AppImage
      run: ./scripts/build-appimage.sh

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: MidiEditor-Linux-x64-binary
        path: midieditor
        retention-days: 30

    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: MidiEditor-Linux-x64-AppImage
        path: MidiEditor-Linux-x86_64.AppImage
        retention-days: 30

  build-linux-static:
    name: Build Static on Linux
    runs-on: ubuntu-latest
    container:
      image: alpine:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt6 and static dependencies
      run: |
        apk add --no-cache \
          qt6-qtbase-dev \
          qt6-qtbase-static \
          qt6-qtmultimedia-dev \
          alsa-lib-dev \
          fluidsynth-dev \
          fluidsynth-static \
          build-base \
          cmake \
          wget \
          file \
          pkgconfig

    - name: Build static project
      run: |
        qmake6 CONFIG+=static QMAKE_LFLAGS+="-static -static-libgcc -static-libstdc++" midieditor.pro
        make -j$(nproc)

    - name: Verify static binary
      run: |
        file MidiEditor
        ldd MidiEditor || echo "Static binary (no dynamic dependencies)"

    - name: Upload static binary
      uses: actions/upload-artifact@v4
      with:
        name: MidiEditor-Linux-x64-static
        path: MidiEditor
        retention-days: 30

